apply plugin: 'com.android.application'

android {
    namespace "com.railarcanum.transkription"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.railarcanum.transkription"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Der Signierschlüssel liegt NICHT in diesem Repo, sondern im getrennten, privaten Repo
    // "whatsapp-transkribieren-signing" (Standard: Nachbarordner, oder per TRANSKRIPTION_SIGNING_DIR).
    def signDir = new File(System.getenv("TRANSKRIPTION_SIGNING_DIR") ?: "${rootProject.projectDir}/../whatsapp-transkribieren-signing")
    def ksFile = new File(signDir, "keystore.properties")
    def ksProps = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile new File(signDir, ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    // Kein stilles Zurückfallen auf einen anderen Schlüssel: ohne Schlüssel gibt es keine Release-APK.
    gradle.taskGraph.whenReady { graph ->
        if (!ksFile.exists() && graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
            throw new GradleException("Signierschlüssel fehlt: ${ksFile} nicht gefunden. "
                    + "Das Repo whatsapp-transkribieren-signing neben dieses Projekt legen "
                    + "oder TRANSKRIPTION_SIGNING_DIR setzen.")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
