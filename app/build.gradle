apply plugin: 'com.android.application'

android {
    namespace "com.railarcanum.transkription"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.railarcanum.transkription"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 4
        versionName "0.4"
        externalNativeBuild {
            cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Der Signierschlüssel liegt nie in diesem Repo, sondern in einem eigenen Verzeichnis
    // (Standard: Nachbarordner "whatsapp-transkribieren-signing", oder per TRANSKRIPTION_SIGNING_DIR).
    def signDir = new File(System.getenv("TRANSKRIPTION_SIGNING_DIR") ?: "${rootProject.projectDir}/../whatsapp-transkribieren-signing")
    def ksFile = new File(signDir, "keystore.properties")
    def ksProps = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile new File(signDir, ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    // Kein stilles Zurückfallen auf einen anderen Schlüssel: ohne Schlüssel gibt es keine Release-APK.
    gradle.taskGraph.whenReady { graph ->
        if (!ksFile.exists() && graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
            throw new GradleException("Signierschlüssel fehlt: ${ksFile} nicht gefunden. "
                    + "Für Release-Builds ein Verzeichnis mit keystore.properties und Schlüssel anlegen "
                    + "und TRANSKRIPTION_SIGNING_DIR darauf zeigen lassen (siehe README). "
                    + "Debug-Builds brauchen keinen Schlüssel.")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            ndk { abiFilters 'arm64-v8a' }               // echte Handys
        }
        debug {
            ndk { abiFilters 'arm64-v8a', 'x86_64' }     // x86_64 nur, damit der Emulator die Transkription prüfen kann
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
