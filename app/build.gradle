apply plugin: 'com.android.application'

android {
    namespace "com.railarcanum.transkription"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.railarcanum.transkription"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Das Modell darf nicht komprimiert werden, sonst kann es nicht direkt geladen werden.
    androidResources { noCompress 'bin' }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
